<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mẫu nền đồng cỏ phía bắc — Linh Thú Ký</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#13261c;color:#f2f5ed;font:15px/1.6 system-ui,sans-serif}
main{width:min(92%,1000px);margin:24px auto 40px}
h1{font-size:23px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 20px;color:#c8d7c8}
a{color:#dbeac0}
.terrain{position:relative;width:100%;overflow:hidden;line-height:0}
.terrain img{display:block;width:100%;height:auto;margin:0}
.edge{position:absolute;left:0;right:0;top:calc(50% - 48px);height:48px;overflow:hidden;transform:scaleY(-1);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.9)20%,transparent 100%)}
.caption{margin-top:16px}
</style>
<main>
<h1>Mẫu nền đồng cỏ phía bắc</h1>
<p>Phía trên: nền mới. Phía dưới: nền hiện tại được giữ nguyên.<br>Chỉ nền cỏ, đường đất và đá lát; bản ảnh để duyệt, chưa gắn vào gameplay.</p>
<div class="terrain">
<img src="meadow-north-01.png" width="1672" height="941" alt="Một nền đồng cỏ mới nối từ phía bắc, đường mòn uốn sang trái">
<img src="current-ground-reference.png" width="1672" height="941" alt="Nền đồng cỏ hiện tại với đường mòn đi lên góc phải">
<div class="edge" aria-hidden="true"><img src="current-ground-reference.png" width="1672" height="941" alt=""></div>
</div>
<p class="caption"><a href="meadow-north-01.png">Xem PNG nền mới ở kích thước gốc</a></p>
</main>
</html>
