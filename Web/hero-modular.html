<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linh Thú Ký · Mẫu nhân vật</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111e1e;color:#e7f0e8;font-family:system-ui,sans-serif}main{max-width:1440px;margin:20px auto;padding:0 18px}h1{font-size:22px;margin:8px 0}p{color:#b3c8bd;font-size:14px;margin:8px 0 18px}.viewport{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#638f35}canvas{width:100%;height:100%;display:block;outline:0;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#1e3830}progress{width:250px;accent-color:#6dcfae}footer{font-size:13px;color:#b3c8bd;margin-top:14px}
</style></head><body><main>
<h1>Mẫu nhân vật</h1><p>Thử đứng, chạy, chém; đổi tóc, màu mắt và chuyển giữa đồ cơ bản với áo ngoài. Mẫu hiện có góc nhìn trước.</p>
<div class="viewport"><canvas id="game" tabindex="0" aria-label="Mẫu nhân vật; WASD di chuyển, J chém, các nút bên phải đổi ngoại hình"></canvas><div id="loading"><p id="message">Đang mở mẫu Unity…</p><progress id="progress" max="1" value="0"></progress></div></div>
<footer>WASD / mũi tên: di chuyển · J: chém · Các nút bên phải: chọn chuyển động và ngoại hình</footer>
</main><script>
const canvas=document.querySelector('#game'),loader=document.createElement('script');loader.src='Build/__LOADER__';
loader.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/__DATA__',frameworkUrl:'Build/__FRAMEWORK__',codeUrl:'Build/__WASM__',streamingAssetsUrl:'StreamingAssets',companyName:'Linh Thu Ky',productName:'ModularHeroTrial',productVersion:'1',devicePixelRatio:window.devicePixelRatio||1,dataCaching:false},v=>document.querySelector('#progress').value=v).then(()=>{document.querySelector('#loading').remove();canvas.focus()}).catch(error=>document.querySelector('#message').textContent=String(error));
loader.onerror=()=>document.querySelector('#message').textContent='Không tải được mẫu. Hãy tải lại trang.';document.body.append(loader);
canvas.onpointerdown=()=>canvas.focus();canvas.onkeydown=e=>{if(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};
</script></body></html>
