<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ngự thú sư · Mẫu góc nhìn cao</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3efdf;color:#233a36;font-family:system-ui,sans-serif}main{max-width:1200px;margin:18px auto;padding:0 16px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:5px 0 14px}small{color:#67755d}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit}button{background:#344e48;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}a{color:#344e48}.viewport{position:relative;aspect-ratio:16/9;background:#6b9947;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #293b3020}canvas{width:100%;height:100%;display:block;outline:0;touch-action:none;image-rendering:auto}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#e5e6c9}footer{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;font-size:14px}progress{width:250px;accent-color:#526e56}button:focus-visible,a:focus-visible{outline:3px solid #c7983f;outline-offset:3px}@media(max-width:600px){main{padding:0 8px}h1{font-size:19px}button{padding:8px 10px;font-size:13px}footer{font-size:12px}}
</style></head><body><main>
<header><div><small>Linh Thú Ký · thử phong cách 2D chibi và góc nhìn cao</small><h1>Ngự thú sư và Huyền Giáp Quy</h1></div><div class="actions"><button id="switch" disabled>Đổi người / thú · Tab</button><button id="reset" disabled>Về điểm xuất phát</button></div></header>
<div class="viewport"><canvas id="game" tabindex="0" aria-label="WASD hoặc bấm sân để di chuyển; Tab đổi người và linh thú"></canvas><div id="loading"><p id="message">Đang mở mẫu Unity…</p><progress id="progress" max="1" value="0"></progress></div></div>
<footer><span>WASD / phím mũi tên · Bấm sân để đi · Tab đổi điều khiển · R về điểm xuất phát</span><a href="http://127.0.0.1:8789/#choi">Bản logic game</a><a href="http://127.0.0.1:8789/#dashboard">Dashboard dự án</a></footer>
</main><script>
const canvas=document.querySelector('#game');let game;const loader=document.createElement('script');loader.src='Build/__LOADER__';
loader.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/__DATA__',frameworkUrl:'Build/__FRAMEWORK__',codeUrl:'Build/__WASM__',streamingAssetsUrl:'StreamingAssets',companyName:'Linh Thu Ky',productName:'HighViewTrial',productVersion:'2',devicePixelRatio:1,dataCaching:false},v=>document.querySelector('#progress').value=v).then(instance=>{game=instance;document.querySelector('#loading').remove();document.querySelector('#reset').disabled=document.querySelector('#switch').disabled=false;canvas.focus()}).catch(error=>document.querySelector('#message').textContent=String(error));
loader.onerror=()=>document.querySelector('#message').textContent='Không tải được mẫu. Hãy tải lại trang.';document.body.append(loader);
document.querySelector('#reset').onclick=()=>{game.SendMessage('Trial','ResetPreview');canvas.focus()};document.querySelector('#switch').onclick=()=>{game.SendMessage('Trial','SwitchControl');canvas.focus()};
canvas.onpointerdown=()=>canvas.focus();canvas.onkeydown=e=>{if(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};
</script></body></html>
